name: "📋 WF7: Weekly Report"

on:
  schedule:
    - cron: "0 9 * * 0"  # Sunday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly report
        run: python scripts/weekly_report.py

      - name: Commit via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "srikarreddyram"
          git config user.email "srikarreddyram@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          BRANCH="auto/weekly-report-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "📋 weekly report: W$(date -u +%W) $(date -u +%Y)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "📋 weekly report: W$(date -u +%W) $(date -u +%Y)" \
            --body "Automated data update from **📋 WF7: Weekly Report**."
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: Post report as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK_LABEL="$(date -u +%Y)-W$(date -u +%W)"
          REPORT_FILE="reports/weekly/${WEEK_LABEL}.md"
          if [ -f "$REPORT_FILE" ]; then
            gh issue create --title "📋 Weekly Report: ${WEEK_LABEL}" --body-file "$REPORT_FILE" --label weekly-report
          fi

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label automation-failure --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "Run failed: $RUN_URL" --label automation-failure
          fi
