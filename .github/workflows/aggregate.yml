name: "📊 WF4: Daily Aggregation"

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregation
        run: |
          python scripts/aggregate.py | tee /tmp/aggregate_output.txt
          echo "TOTAL=$(grep 'TOTAL_EVENTS=' /tmp/aggregate_output.txt | cut -d= -f2)" >> $GITHUB_ENV

      - name: Commit via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "srikarreddyram"
          git config user.email "srikarreddyram@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          BRANCH="auto/aggregate-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "📊 aggregated datasets updated (${{ env.TOTAL || '0' }} total)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "📊 aggregated datasets updated (${{ env.TOTAL || '0' }} total)" \
            --body "Automated data update from **📊 WF4: Daily Aggregation**."
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label automation-failure --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "Run failed: $RUN_URL" --label automation-failure
          fi
