name: "📥 WF1: Daily Collection"

on:
  schedule:
    - cron: "30 0 * * *"  # 00:30 UTC daily
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/collect.py | tee /tmp/collect_output.txt
          echo "ARTICLE_COUNT=$(grep 'ARTICLE_COUNT=' /tmp/collect_output.txt | cut -d= -f2)" >> $GITHUB_ENV

      - name: Commit via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "srikarreddyram"
          git config user.email "srikarreddyram@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          BRANCH="auto/collect-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "📥 raw collection: $(date -u +%Y-%m-%d) (${{ env.ARTICLE_COUNT || '0' }} articles)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "📥 raw collection: $(date -u +%Y-%m-%d) (${{ env.ARTICLE_COUNT || '0' }} articles)" \
            --body "Automated data update from **📥 WF1: Daily Collection**."
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label automation-failure --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "Run failed: $RUN_URL" --label automation-failure
          fi
