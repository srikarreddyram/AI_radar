name: "📐 WF8: Event Study"

on:
  schedule:
    - cron: "30 9 * * 0"  # Sunday 09:30 UTC, right after the weekly report
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run event study
        run: |
          python scripts/event_study.py | tee /tmp/event_study_output.txt
          echo "ROW_COUNT=$(grep 'ROW_COUNT=' /tmp/event_study_output.txt | cut -d= -f2)" >> $GITHUB_ENV

      - name: Commit via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "srikarreddyram"
          git config user.email "srikarreddyram@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          BRANCH="auto/event-study-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "📐 event study: ${{ env.ROW_COUNT || '0' }} company/category rows"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "📐 event study: $(date -u +%Y-%m-%d)" \
            --body "Automated report from **📐 WF8: Event Study**."
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: Post report as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          REPORT_FILE="reports/event_study/${TODAY}.md"
          if [ -f "$REPORT_FILE" ]; then
            gh issue create --title "📐 Event Study: ${TODAY}" --body-file "$REPORT_FILE" --label event-study
          fi

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label automation-failure --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "Run failed: $RUN_URL" --label automation-failure
          fi
