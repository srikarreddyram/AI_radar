name: "🔍 WF3: Entity Extraction"

on:
  schedule:
    - cron: "30 1 * * *"  # 01:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run entity extraction
        run: |
          python scripts/entity_extract.py | tee /tmp/extract_output.txt
          echo "EVENT_COUNT=$(grep 'EVENT_COUNT=' /tmp/extract_output.txt | cut -d= -f2)" >> $GITHUB_ENV

      - name: Commit via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "srikarreddyram"
          git config user.email "srikarreddyram@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          BRANCH="auto/entity-extract-$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "🔍 entities extracted: ${{ env.EVENT_COUNT || '0' }} events"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "🔍 entities extracted: ${{ env.EVENT_COUNT || '0' }} events" \
            --body "Automated data update from **🔍 WF3: Entity Extraction**."
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label automation-failure --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "Run failed: $RUN_URL" --label automation-failure
          fi
